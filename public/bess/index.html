<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acumula BESS</title>
    <meta name="description" content="Panel de inteligencia para baterías BESS stand-alone e híbridas: ingresos, mercado, eficiencias y control en tiempo real." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect x=%223%22 y=%228%22 width=%2224%22 height=%2216%22 rx=%224%22 fill=%22%231f6f5c%22/><rect x=%2227%22 y=%2213%22 width=%223%22 height=%226%22 rx=%221%22 fill=%22%231f6f5c%22/><path d=%22M16 10l-5 7h4l-1 5 5-7h-4z%22 fill=%22white%22/></svg>" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <div id="app" class="app">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><rect x="2" y="8" width="24" height="16" rx="4" fill="currentColor" opacity=".18"/><rect x="2" y="8" width="24" height="16" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><rect x="27" y="13" width="3" height="6" rx="1" fill="currentColor"/><path d="M15 11l-5 6.5h4l-1 4.5 5-6.5h-4z" fill="currentColor"/></svg>
          <div><b>Acumula</b><span>BESS Intelligence</span></div>
        </div>
        <label class="asset-pick">
          <span>Activo</span>
          <select id="assetSelect"></select>
        </label>
        <nav>
          <div class="nav-title">Analítica</div>
          <a href="#/executive" data-route="executive"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Ejecutivo</a>
          <a href="#/market" data-route="market"><svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 4 8-9M15 7h5v5"/></svg>Mercado BESS</a>
          <a href="#/realtime" data-route="realtime"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Tiempo real</a>
          <div class="nav-title">Gestión</div>
          <a href="#/alarms" data-route="alarms"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9M10 21h4"/></svg>Alarmas <em id="alarmBadge" class="badge" hidden></em></a>
          <a href="#/settings" data-route="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-2.9 1.2V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-2.9-1.2l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00-1.2-2.9H3a2 2 0 110-4h.1a1.7 1.7 0 001.2-2.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 002.9-1.2V3a2 2 0 114 0v.1a1.7 1.7 0 002.9 1.2l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 001.2 2.9h.1a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>Activos y ajustes</a>
        </nav>
        <div class="side-foot">Datos simulados con motor físico‑económico.<br />Importa precios OMIE reales en Ajustes.</div>
      </aside>
      <div class="scrim" id="scrim"></div>
      <main class="main">
        <header class="topbar">
          <button class="icon-btn" id="menuBtn" aria-label="Menú"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
          <div class="pills">
            <span class="pill" id="pillConn"><i class="dot"></i><small>Conexión</small><b>–</b></span>
            <span class="pill" id="pillP"><small>Potencia</small><b>–</b></span>
            <span class="pill" id="pillSoc"><small>SOC</small><b>–</b></span>
          </div>
          <div class="top-actions">
            <button class="icon-btn" id="insightBtn" title="Asistente de análisis" aria-label="Asistente de análisis"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8zM19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></svg></button>
            <button class="icon-btn" id="themeBtn" title="Tema claro/oscuro" aria-label="Cambiar tema"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
            <span class="pill clock"><small>Actualizado</small><b id="clock">–</b></span>
          </div>
        </header>
        <section id="view" class="view"></section>
      </main>
      <aside class="drawer" id="drawer" aria-hidden="true">
        <div class="drawer-head"><b>Asistente de análisis</b><button class="icon-btn" id="drawerClose" aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div id="drawerBody" class="drawer-body"></div>
      </aside>
    </div>
    <div id="toast" class="toast" role="status"></div>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
