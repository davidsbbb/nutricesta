<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plan Hidráulico</title>
    <meta name="description" content="Planificación del turbinado del día siguiente con precios OMIE automáticos." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><path d=%22M16 3C11 10 7 14.5 7 19a9 9 0 0018 0c0-4.5-4-9-9-16z%22 fill=%22%231f6f5c%22/></svg>" />
    <link rel="stylesheet" href="./css/styles.css" />
    <style>
      .inputs { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
      .hours { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; }
      @media (max-width: 600px) { .hours { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
      .hours label { display: flex; flex-direction: column; align-items: center; font-size: 10.5px; color: var(--muted); gap: 2px; }
      .hours input[type="number"] { width: 100%; padding: 5px 2px; text-align: center; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-2); color: var(--ink); font-size: 12px; }
      .hours input[type="checkbox"] { accent-color: var(--critical); width: 18px; height: 18px; }
      .src-badge { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); }
      .src-badge i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
      .src-badge.manual i { background: var(--series-1); }
      .src-badge.ejemplo { border-color: var(--warning); }
      .src-badge.ejemplo i { background: var(--warning); }
      .warn-box { border: 1px solid var(--warning); background: color-mix(in srgb, var(--warning) 12%, var(--surface)); border-radius: 12px; padding: 10px 14px; font-size: 13px; margin-bottom: 14px; }
      .row-hl td { background: color-mix(in srgb, var(--brand) 10%, transparent); }
      .toggle { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--ink-2); }
      .plan-list .alarm b { font-size: 14px; }
      textarea { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="app" class="app">
      <aside class="sidebar">
        <div class="brand">
          <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><path d="M16 3C11 10 7 14.5 7 19a9 9 0 0018 0c0-4.5-4-9-9-16z" fill="currentColor" opacity=".25" stroke="currentColor" stroke-width="2"/><path d="M11 20a5 5 0 005 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <div><b>Plan Hidráulico</b><span>Previsión D+1</span></div>
        </div>
        <label class="asset-pick"><span>Central</span><select id="plantSelect"></select></label>
        <nav>
          <div class="nav-title">Planificación</div>
          <a href="#/plan" data-route="plan"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Plan del día</a>
          <a href="#/precios" data-route="precios"><svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 4 8-9M15 7h5v5"/></svg>Precios OMIE</a>
          <a href="#/historial" data-route="historial"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 109-9 9 9 0 00-7 3.3M3 4v4h4M12 7v5l3 2"/></svg>Planes guardados</a>
          <div class="nav-title">Configuración</div>
          <a href="#/centrales" data-route="centrales"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Centrales</a>
        </nav>
        <div class="side-foot">Herramienta de ayuda a la decisión.<br />No se conecta al SCADA ni a W2M.</div>
      </aside>
      <div class="scrim" id="scrim"></div>
      <main class="main">
        <header class="topbar">
          <button class="icon-btn" id="menuBtn" aria-label="Menú"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
          <div class="pills">
            <span class="pill" id="pillOmie"><small>OMIE mañana</small><b>…</b></span>
            <span class="pill" id="pillAvg"><small>Media mañana</small><b>…</b></span>
          </div>
          <div class="top-actions">
            <button class="icon-btn" id="themeBtn" title="Tema claro/oscuro" aria-label="Cambiar tema"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
          </div>
        </header>
        <section id="view" class="view"></section>
      </main>
    </div>
    <div id="toast" class="toast" role="status"></div>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
