<h2>Acceso a FOCO (entorno privado de pruebas)</h2>
<p>Tu código de acceso es:</p>
<p style="font-size:28px;font-weight:bold;letter-spacing:4px">{{ .Token }}</p>
<p>O pulsa este enlace (funciona aunque lo abras en otro navegador o en el móvil):</p>
<p><a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=email">Entrar en FOCO</a></p>
<p style="color:#666;font-size:12px">Si no has pedido este acceso, ignora este mensaje. Entorno privado de pruebas. No es un servicio de inversión.</p>
